# ============================================================================
# ROS — Alertmanager (MR-03) · ตัวอย่าง routing → Email + LINE (webhook)
# แก้ค่าจริงก่อนใช้ (SMTP / LINE Notify token หรือ Messaging API)
# ============================================================================
route:
  receiver: ros-default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: ros-critical
      repeat_interval: 1h

receivers:
  - name: ros-default
    email_configs:
      - to: "ops@example.com"
        from: "alert@example.com"
        smarthost: "smtp.example.com:587"
        auth_username: "alert@example.com"
        auth_password: "CHANGE_ME"
        send_resolved: true

  - name: ros-critical
    email_configs:
      - to: "ops@example.com"
        from: "alert@example.com"
        smarthost: "smtp.example.com:587"
        auth_username: "alert@example.com"
        auth_password: "CHANGE_ME"
        send_resolved: true
    # LINE: ใช้ webhook receiver ชี้ไป bridge/LINE Notify (NotificationService ของแอปยัง stub)
    webhook_configs:
      - url: "http://line-bridge:8080/notify"
        send_resolved: true
