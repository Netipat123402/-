# ============================================================================
# ROS — Prometheus scrape config (MR-03)
# ============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ROS API metrics (/api/v1/metrics) — ตั้ง METRICS_TOKEN แล้วใส่ bearer ที่นี่
  - job_name: "ros-api"
    metrics_path: /api/v1/metrics
    # ถ้าตั้ง METRICS_TOKEN ใน api ให้ uncomment:
    # authorization:
    #   type: Bearer
    #   credentials: "<METRICS_TOKEN>"
    static_configs:
      - targets: ["api:4000"]

  # host metrics (disk/cpu/mem) — สำหรับ alert ดิสก์เต็ม
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
