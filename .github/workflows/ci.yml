# ============================================================================
# ROS — CI (MR-02) · required check ทุก PR/push
# gate: typecheck + jest + build (3 แอป) · lint = non-blocking (ยังไม่ติดตั้ง eslint)
# images: build 3 Docker image จาก Dockerfile (พิสูจน์ว่า build เป็น artifact ได้)
# ============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema db/prisma/schema.prisma

      # lint ยังไม่ติดตั้ง eslint (ดู MR ภายหลัง) — รันแบบไม่บล็อก
      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          npm run lint -w @ros/api || true
          npm run lint -w @ros/web-admin || true

      - name: Typecheck (api)
        run: npm run typecheck -w @ros/api
      - name: Typecheck (web-admin)
        run: npm run typecheck -w @ros/web-admin
      - name: Typecheck (web-public)
        run: npm run typecheck -w @ros/web-public

      - name: Test (jest — api)
        run: npm test -w @ros/api

      - name: Build (api)
        run: npm run build -w @ros/api
      - name: Build (web-admin)
        run: npm run build -w @ros/web-admin
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Build (web-public)
        run: npm run build -w @ros/web-public
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: Integration / E2E (supertest + Postgres)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ros
          POSTGRES_PASSWORD: ros
          POSTGRES_DB: ros_e2e
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ros" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ros:ros@localhost:5432/ros_e2e?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema db/prisma/schema.prisma
      - name: Migrate test DB
        run: npx prisma migrate deploy --schema db/prisma/schema.prisma
      - name: Seed test DB
        run: npm run db:seed -w @ros/db
        env:
          NODE_ENV: development
      - name: Run e2e (auth/RBAC/no-orphan + public→contract→receipt)
        run: npm run test:e2e -w @ros/api
        env:
          NODE_ENV: test

  images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: ros-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web-admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-admin/Dockerfile
          push: false
          tags: ros-web-admin:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web-public image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-public/Dockerfile
          push: false
          tags: ros-web-public:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
